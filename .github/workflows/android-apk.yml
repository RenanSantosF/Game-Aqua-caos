name: Build APK Android

# Gera o APK de teste a cada push na main (ou manualmente em Actions → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e dos templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android-v1

      - name: Baixar Godot ${{ env.GODOT_RELEASE }} e templates de exportação
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          wget -q -O /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          wget -q -O /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # Guarda só o que o Android precisa (o pacote completo tem ~1 GB).
          cp /tmp/tpl/templates/android_* /tmp/tpl/templates/version.txt "$dest/"
          ls -la "$dest"

      - name: Configurar Android SDK, Java e keystore no Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar o plugin de anúncios (AdMob)
        run: |
          set -e
          cd android_plugin
          gradle --no-daemon assembleRelease
          mkdir -p ../addons/aqua_ads/bin
          cp build/outputs/aar/aqua-ads-release.aar ../addons/aqua_ads/bin/aqua-ads.aar

      - name: Instalar o template de build Android (Gradle)
        run: |
          set -e
          rm -rf android
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Numerar a versão com o número da execução
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Importar recursos do projeto
        run: ~/godot/godot --headless --import || true

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ~/godot/godot --headless --export-debug "Android" build/aqua-caos.apk
          test -f build/aqua-caos.apk
          ls -la build

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aqua-caos-apk
          path: build/aqua-caos.apk
          retention-days: 30

      - name: Publicar APK na release "apk-teste" (download fácil pelo celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-teste --yes --cleanup-tag || true
          gh release create apk-teste build/aqua-caos.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "APK de teste (build #${{ github.run_number }})" \
            --notes "APK de teste gerado automaticamente do commit ${GITHUB_SHA::7}. Baixe o arquivo aqua-caos.apk abaixo e instale no Android."
